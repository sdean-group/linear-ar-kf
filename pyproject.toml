[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-ar-kf"
version = "0.1.0"
description = "Experiments for linear autoregressive models and Kalman filtering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "torch",
]

[tool.setuptools]
packages = ["exp"]
